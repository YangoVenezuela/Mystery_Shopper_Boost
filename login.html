<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Shopper · Acceso</title><style>body{background:#f6f6f8;font:16px Arial;display:grid;place-items:center;min-height:95vh}form{background:#fff;padding:35px;border-radius:18px;width:min(350px,80vw)}img{width:110px}h1{font-size:23px}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:12px;border:1px solid #ddd;border-radius:8px;font:inherit}button{background:#ff0033;color:white;border:0;cursor:pointer}#msg{color:#b00020;font-size:14px}</style><form id="form"><img src="/yango_logo.png" alt="Yango"><h1>Mystery Shopper</h1><p>Registro de viajes</p><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button><p id="msg" role="status"></p></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.href='/';else document.getElementById('msg').textContent='Contraseña incorrecta o demasiados intentos. Intenta más tarde.'}catch{document.getElementById('msg').textContent='No se pudo conectar.'}};</script></html>
